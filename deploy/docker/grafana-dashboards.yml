apiVersion: 1

providers:
  - name: 'CyberDefense Arsenal Dashboards'
    orgId: 1
    folder: 'CyberDefense Arsenal'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true